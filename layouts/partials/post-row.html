<article class="writing-row"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time><div><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>{{ with .Description }}<p>{{ . }}</p>{{ end }}{{ if eq .Type "external-redirect" }}<p class="external-label">Published elsewhere</p>{{ end }}</div>{{ if ne .Type "external-redirect" }}<span class="reading-time">{{ .ReadingTime }} min read</span>{{ end }}</article>
